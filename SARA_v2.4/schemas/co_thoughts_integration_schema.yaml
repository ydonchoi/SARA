version: "2.4"
name: sara_co_thoughts_integration
purpose: >
  Boundary contract between Co-thoughts v2.0 cognitive generation and
  SARA epistemic verification. Cognitive output never self-promotes to evidence.

integration:
  source: co-thoughts
  operations:
    - knowledge_gate
    - thought_gate

claim:
  required:
    - id
    - text
    - type
  optional:
    - attribution_evidence_ids
  attribution_requirements:
    AUTHOR_EXPLICIT_requires_at_least_one: attribution_evidence_ids
  type:
    - FACT
    - INTERPRETATION
    - INFERENCE
    - HYPOTHESIS
    - SIMULATION

premise:
  required:
    - id
    - text
    - type
  type:
    - FACT
    - INTERPRETATION
    - INFERENCE
    - HYPOTHESIS
    - SIMULATION

evidence:
  required:
    - id
    - source
  alignment:
    - SUPPORTS_CLAIM
    - SUPPORTS_PREMISE
    - CHALLENGES_CLAIM
    - CHALLENGES_PREMISE
    - NEUTRAL
    - UNASSESSED

context:
  temporal:
    - HISTORICAL
    - POST_PUBLICATION
    - CONTEMPORARY
  interpretive:
    - AUTHOR_EXPLICIT
    - AUTHOR_SUPPORTED
    - SOURCE_INFERRED
    - FIELD_INTERPRETATION
    - MODERN_INTERPRETATION
    - SPECULATIVE
    - UNKNOWN

verification:
  status:
    - VERIFIED
    - PARTIALLY_VERIFIED
    - UNVERIFIED
    - CONTRADICTED

provenance:
  source_types:
    - SOURCE
    - HUMAN
    - MODEL
    - DIALOGUE
    - INFERENCE
    - EXTERNAL_EVIDENCE
    - VERIFICATION
    - REVISION

firewall:
  - modern_interpretation_must_not_promote_to_author_explicit_without_source_evidence
  - model_inference_must_not_promote_to_source_claim_without_source_evidence
  - dialogue_agreement_must_not_promote_verification_status
  - checkpoint_must_not_be_used_as_evidence
  - execution_success_must_not_promote_research_verification

logical_audit:
  categories:
    - FORMAL_VALIDITY
    - INFERENCE_STRENGTH
    - CAUSAL_INFERENCE
    - GENERALIZATION
    - CONCEPT_EQUIVOCATION
    - CIRCULAR_REASONING
    - NON_SEQUITUR
    - EVIDENCE_SCOPE_MISMATCH
    - ALTERNATIVE_EXPLANATION
    - OTHER
  finding_status:
    - CANDIDATE
    - SUBSTANTIATED
    - REJECTED
    - UNASSESSED
  severity:
    - CRITICAL
    - MATERIAL
    - MINOR
    - UNASSESSED
  boundary:
    - structural_cycle_is_candidate_only
    - logical_audit_output_is_not_evidence
    - graph_integrity_does_not_establish_semantic_validity


runtime_integration:
  callable_entrypoint: sara_runtime.execute_request
  epistemic_adapter: co_thoughts_sara_adapter.CoThoughtsSARAAdapter
  logical_audit_entrypoint: logical_audit.validate_argument_graph
  argument_graph:
    required_fields: [nodes, edges]
    free_form_text_parsing: NOT_SUPPORTED
    absent_graph_status: NOT_RUN
    malformed_graph_status: INVALID_INPUT
  source_attribution:
    AUTHOR_EXPLICIT_requires_nonempty_evidence_source: true
  boundaries:
    - v2.4_assessment_is_decision_support_not_evidence
    - structural_cycle_is_candidate_only
    - semantic_audit_remains_NOT_PERFORMED_without_semantic_evaluator
    - provider_execution_uses_injected_v2_3_contract

name: Follow-up Content Access Reuse

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "SARA_v2.3/production_verification_backend.py"
      - "tests/test_p41_production_observation_wiring.py"

jobs:
  content-access-reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run P41 observation regression tests
        run: pytest -q tests/test_p41_production_observation_wiring.py

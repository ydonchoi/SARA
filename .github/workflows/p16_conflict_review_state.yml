name: P16 conflict review state

on:
  workflow_dispatch:
  pull_request:

jobs:
  conflict-review-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_conflict_review_state.py -q

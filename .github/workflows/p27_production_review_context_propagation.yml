name: P27 production review context propagation
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p27-production-review-context-propagation
  pull_request:
jobs:
  propagation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_production_review_context_propagation.py -q

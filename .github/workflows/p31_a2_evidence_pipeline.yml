name: P31 A2 evidence pipeline integration

on:
  push:
  pull_request:

jobs:
  p31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pytest -q tests/test_p31_a2_evidence_pipeline.py
      - run: python -m pytest -q tests/test_crossref_content_accessor.py

name: P22 review event integrity
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p22-review-event-integrity
  pull_request:
jobs:
  review-event-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_event_integrity.py -q

name: P41 production observation wiring

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "SARA_v2.3/production_verification_backend.py"
      - "SARA_v2.3/production_observation_wiring.py"
      - "SARA_v2.3/evidence_flow_observation.py"
      - "SARA_v2.3/evidence_flow_observation_adapter.py"
      - "tests/test_production_verification_backend.py"
      - "tests/test_p41_production_observation_wiring.py"

jobs:
  p41-production-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_production_verification_backend.py tests/test_p41_production_observation_wiring.py

name: SARA v3 Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run v3 integration, regression-comparison and local release-gate tests
        run: python -m pytest SARA_v3/tests -q -rs
      - name: Run full repository suite
        run: python -m pytest -q

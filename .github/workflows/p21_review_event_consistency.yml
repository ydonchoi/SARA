name: P21 review event consistency
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p21-review-event-consistency
  pull_request:
jobs:
  review-event-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_event_consistency.py -q

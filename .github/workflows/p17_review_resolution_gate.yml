name: P17 review resolution gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  review-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_resolution_gate.py -q

name: P24 review audit consumption boundary
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p24-review-audit-consumption-boundary
  pull_request:
jobs:
  review-audit-consumption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_audit_consumption.py -q

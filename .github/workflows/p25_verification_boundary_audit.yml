name: P25 verification boundary audit
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p25-verification-boundary-audit
  pull_request:
jobs:
  verification-boundary-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_verification_boundary_audit.py -q

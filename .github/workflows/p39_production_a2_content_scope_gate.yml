name: P39 production A2 content-scope gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "SARA_v2.3/production_verification_backend.py"
      - "SARA_v2.3/a2_evidence_pipeline.py"
      - "tests/test_p32_production_a2_pipeline_hook.py"
      - "tests/test_p31_a2_evidence_pipeline.py"

jobs:
  p39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_p32_production_a2_pipeline_hook.py tests/test_p31_a2_evidence_pipeline.py

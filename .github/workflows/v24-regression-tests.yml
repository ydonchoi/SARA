name: SARA v2.4 Regression Tests

on:
  pull_request:
    paths:
      - "SARA_v2.4/**"
      - ".github/workflows/v24-regression-tests.yml"
  push:
    branches:
      - main
      - "fix/v24-regression-baseline-rebased"
    paths:
      - "SARA_v2.4/**"
      - ".github/workflows/v24-regression-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v24-epistemic-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run v2.4 epistemic regression tests
        working-directory: SARA_v2.4
        run: python -m pytest -q tests/test_epistemic.py

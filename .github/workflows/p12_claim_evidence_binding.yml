name: P12 claim evidence binding

on:
  workflow_dispatch:
  pull_request:

jobs:
  claim-evidence-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_claim_evidence_binding.py -q

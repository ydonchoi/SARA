name: P30 content access payload boundary
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p30-content-access-payload-boundary
  pull_request:
jobs:
  p30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_p30_content_access_payload.py tests/test_crossref_content_accessor.py -q

name: P13 verification promotion firewall

on:
  workflow_dispatch:
  pull_request:

jobs:
  verification-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_verification_promotion.py -q

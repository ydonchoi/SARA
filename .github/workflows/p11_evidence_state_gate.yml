name: P11 evidence state gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  evidence-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_evidence_state_gate.py -q

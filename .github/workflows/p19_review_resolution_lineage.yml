name: P19 review resolution lineage

on:
  workflow_dispatch:
  pull_request:

jobs:
  review-resolution-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_resolution_lineage.py -q

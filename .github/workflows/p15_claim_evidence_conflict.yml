name: P15 claim evidence conflict

on:
  workflow_dispatch:
  pull_request:

jobs:
  claim-evidence-conflict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_claim_evidence_conflict.py -q

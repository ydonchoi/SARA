name: P20 review event record
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p20-review-event-record
  pull_request:
jobs:
  review-event-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_event_record.py -q

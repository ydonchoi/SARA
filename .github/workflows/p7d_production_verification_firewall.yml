name: P7-D production verification firewall

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "SARA_v2.3/production_verification_backend.py"
      - "tests/test_production_verification_firewall.py"

jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q tests/test_production_verification_firewall.py

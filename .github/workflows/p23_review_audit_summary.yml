name: P23 review audit summary
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p23-review-audit-summary
  pull_request:
jobs:
  review-audit-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_audit_summary.py -q

name: P26 review context execution boundary
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p26-review-context-execution-boundary
  pull_request:
jobs:
  review-context-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_review_context_execution_boundary.py -q
